[package]
name = "npm-mirror-desktop"
version = "0.0.3"
edition = "2021"
description = "离月私人 npm 镜像源 · 桌面版"
authors = ["苏离月 (SuLiyue)"]
license = "MIT"
repository = "https://github.com/SuLiyue-s/npm-mirror"
build = "build.rs"
default-run = "npm-mirror-desktop"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Threading",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
